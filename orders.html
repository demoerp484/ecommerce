<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders (admin)</title>
<style>
:root{--bg:#f7f5f0;--ink:#1d2a2a;--muted:#6b7776;--line:#dcd8cf;--card:#fff;--accent:#1f6f6b;--accent-ink:#fff;--danger:#b3372e}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--ink:#eaf0ef;--muted:#9aa8a7;--line:#2c3737;--card:#1b2323;--accent:#4fb3ad;--accent-ink:#0b1514;--danger:#e07a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 5vw;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.3rem}
nav{display:flex;gap:8px}
.btn,button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;font-size:.9rem;text-decoration:none;display:inline-block}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding:20px 5vw 60px}
.box{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.box h2{margin-top:0}
label{display:block;font-size:.85rem;margin:10px 0 4px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:.95rem}
.msg{font-size:.85rem;color:var(--danger);min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#q{max-width:460px;margin-bottom:6px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:14px}
.order{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{color:var(--muted);font-size:.85rem}
.line{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.status{font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:10px}
.s-New{background:#f3d9a4;color:#4a3300}.s-Confirmed{background:#c9e0f5;color:#0e2f4d}.s-Shipped{background:#d6d0f0;color:#2a2060}.s-Delivered{background:#cfe8d2;color:#16401d}.s-Cancelled{background:#f2cfcb;color:#5a1812}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.controls label{margin:0 0 2px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Orders</h1>
  <nav><a class="btn" href="index.html">Back to shop</a><button id="logoutBtn" class="hidden">Log out</button></nav>
</header>
<main class="wrap">
  <p id="loading" class="note">Loading...</p>
  <section id="loginBox" class="box hidden">
    <h2>Admin login</h2>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password">
    <p class="msg" id="loginMsg"></p>
    <button id="loginGo" class="primary">Log in</button>
  </section>
  <section id="denied" class="box hidden"><p>This account is not an admin. Log out and sign in with the admin email.</p></section>
  <section id="app" class="hidden">
    <div id="chips" class="chips"></div>
    <input id="q" type="search" placeholder="Search by name, phone, email, address or order number">
    <div id="list" class="list"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBydb1teoX761Dbsaw7I3tv72YxDC4px7g",
  authDomain: "ecommercedemo-3d5cb.firebaseapp.com",
  projectId: "ecommercedemo-3d5cb",
  appId: "1:232373069175:web:74c8412f0346dceaba6d72"
};
const CURRENCY = "AED ";
const ADMIN_EMAILS = ["jaseermtp@gmail.com"];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => CURRENCY + Number(n || 0).toFixed(2);
const STATUSES = ["New", "Confirmed", "Shipped", "Delivered", "Cancelled"];
const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);
let orders = [], filter = "All", unsub = null;

onAuthStateChanged(auth, u => {
  $("loading").classList.add("hidden");
  const admin = !!u && ADMIN_EMAILS.map(e => e.toLowerCase()).includes((u.email || "").toLowerCase());
  $("logoutBtn").classList.toggle("hidden", !u);
  $("loginBox").classList.toggle("hidden", !!u);
  $("denied").classList.toggle("hidden", !(u && !admin));
  $("app").classList.toggle("hidden", !admin);
  if (unsub) { unsub(); unsub = null; }
  if (admin) unsub = onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), s => {
    orders = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => { $("list").innerHTML = '<p class="msg">Could not load orders: ' + esc(err.message) + '</p>'; });
});

$("loginGo").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); $("pass").value = ""; }
  catch { $("loginMsg").textContent = "Wrong email or password."; }
};
$("logoutBtn").onclick = () => signOut(auth);

const st = o => o.status || "New";
function waNum(c) {
  if (/@/.test(String(c || ""))) return "";
  let d = String(c || "").replace(/\D/g, "");
  if (d.length < 8) return "";
  if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "971" + d.slice(1); else if (/^5\d{8}$/.test(d)) d = "971" + d;
  return d;
}
function waLink(o) {
  const n = waNum(o.contact); if (!n) return "";
  const text = "Hello " + (o.customer || "") + ", your order " + o.id.slice(0, 6).toUpperCase() + " is now " + st(o) + ". Total " + money(o.total) + ". Thank you!";
  return `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(text)}">Message customer on WhatsApp</a>`;
}
function render() {
  const counts = { All: orders.length };
  STATUSES.forEach(x => counts[x] = orders.filter(o => st(o) === x).length);
  $("chips").innerHTML = ["All", ...STATUSES].map(x => `<button data-f="${x}" aria-pressed="${x === filter}">${x} (${counts[x]})</button>`).join("");
  const q = $("q").value.trim().toLowerCase();
  const list = orders.filter(o => (filter === "All" || st(o) === filter) &&
    (!q || [o.id, o.customer, o.contact, o.address].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML = list.length ? list.map(o => {
    const when = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString() : "Just now";
    const lines = (o.items || []).map(x => `<div class="line"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.price * x.qty)}</span></div>`).join("");
    const pay = o.paymentStatus === "Paid" ? "Paid" : "Unpaid";
    return `<article class="order">
      <div class="row"><strong>Order ${esc(o.id.slice(0, 6).toUpperCase())}</strong><span class="status s-${st(o)}">${st(o)}</span></div>
      <div class="note">${esc(when)}${o.guest ? " (guest)" : ""}</div>
      <div><strong>${esc(o.customer)}</strong><br>${esc(o.contact)}<br>${esc(o.address || "No address given")}</div>
      <div>${lines}<div class="line"><span>Delivery</span><span>${o.deliveryFee ? money(o.deliveryFee) : "Free"}</span></div></div>
      <div class="row"><strong>Total</strong><strong>${money(o.total)}</strong></div>
      <div class="note">${esc(o.payment || "Cash on delivery")}</div>
      <div class="controls">
        <div><label for="s-${o.id}">Order status</label><select id="s-${o.id}" data-status="${o.id}">${STATUSES.map(x => `<option ${x === st(o) ? "selected" : ""}>${x}</option>`).join("")}</select></div>
        <div><label for="p-${o.id}">Payment</label><select id="p-${o.id}" data-pay="${o.id}">${["Unpaid", "Paid"].map(x => `<option ${x === pay ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      </div>
      ${waLink(o)}<button class="danger" data-del="${o.id}">Delete order</button>
    </article>`;
  }).join("") : '<p class="note">No orders to show.</p>';
}
$("chips").addEventListener("click", e => { if (e.target.dataset.f) { filter = e.target.dataset.f; render(); } });
$("q").oninput = render;
$("list").addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.dataset.status) await setDoc(doc(db, "orders", t.dataset.status), { status: t.value }, { merge: true });
    if (t.dataset.pay) await setDoc(doc(db, "orders", t.dataset.pay), { paymentStatus: t.value }, { merge: true });
  } catch (err) { alert("Could not update the order: " + err.message); }
});
$("list").addEventListener("click", async e => {
  const id = e.target.dataset.del;
  if (!id || !confirm("Delete this order?")) return;
  try { await deleteDoc(doc(db, "orders", id)); } catch (err) { alert("Could not delete the order: " + err.message); }
});
</script>
</body>
</html>
