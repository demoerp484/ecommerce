<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Shop</title>
<style>
:root{--bg:#f7f5f0;--ink:#1d2a2a;--muted:#6b7776;--line:#dcd8cf;--card:#fff;--accent:#1f6f6b;--accent-ink:#fff;--danger:#b3372e}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--ink:#eaf0ef;--muted:#9aa8a7;--line:#2c3737;--card:#1b2323;--accent:#4fb3ad;--accent-ink:#0b1514;--danger:#e07a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,h3,button,input,textarea,label,.price{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:1.3rem}
nav{display:flex;gap:8px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;font-size:.9rem}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{padding:48px 5vw 20px}
.hero h2{font-size:clamp(1.8rem,4vw,2.8rem);margin:0 0 6px;max-width:18ch;line-height:1.15}
.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:20px 5vw 60px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.item .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-size:1rem}
.item p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.price{font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{padding:40px 5vw;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-top:0}
label{display:block;font-size:.85rem;margin:10px 0 4px}
input,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:.95rem}
.preview{max-width:100%;max-height:160px;margin-top:8px;border-radius:6px}
.cartline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:.9rem}
.msg{font-size:.85rem;color:var(--danger);min-height:1.2em;font-family:system-ui,sans-serif}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="shopName">My Shop</h1>
  <nav>
    <button id="adminBtn">Admin</button>
    <button id="addBtn" class="primary hidden">Add item</button>
    <button id="logoutBtn" class="hidden">Log out</button>
    <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
  </nav>
</header>

<section class="hero">
  <h2>Everything in stock, ready to ship</h2>
  <p>Browse the items below and add them to your cart.</p>
</section>
<main id="grid" class="grid"></main>
<p id="empty" class="empty hidden">No items yet. Log in as admin and add your first item.</p>

<!-- Login -->
<dialog id="loginDlg">
  <h2>Admin login</h2>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password">
  <p class="msg" id="loginMsg"></p>
  <div class="row"><button id="loginCancel">Cancel</button><button id="loginGo" class="primary">Log in</button></div>
</dialog>

<!-- Add / edit item -->
<dialog id="itemDlg">
  <h2 id="itemTitle">Add item</h2>
  <label for="iName">Name</label><input id="iName">
  <label for="iPrice">Price</label><input id="iPrice" type="number" min="0" step="0.01">
  <label for="iDesc">Description</label><textarea id="iDesc" rows="3"></textarea>
  <label for="iPhoto">Photo</label><input id="iPhoto" type="file" accept="image/*">
  <img id="iPreview" class="preview hidden" alt="Photo preview">
  <p class="msg" id="itemMsg"></p>
  <div class="row"><button id="itemCancel">Cancel</button><button id="itemSave" class="primary">Save item</button></div>
</dialog>

<!-- Cart -->
<dialog id="cartDlg">
  <h2>Your cart</h2>
  <div id="cartLines"></div>
  <p class="row"><strong>Total</strong><strong id="cartTotal" class="price"></strong></p>
  <label for="cName">Your name</label><input id="cName">
  <label for="cContact">Phone or email</label><input id="cContact">
  <p class="msg" id="cartMsg"></p>
  <div class="row"><button id="cartClose">Close</button><button id="cartOrder" class="primary">Place order</button></div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, setDoc, doc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== 1. PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps) ====== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
const SHOP_NAME = "My Shop";
const CURRENCY = "$";
/* ================================================================================================= */

document.getElementById("shopName").textContent = SHOP_NAME;
document.title = SHOP_NAME;
const $ = id => document.getElementById(id);
const configured = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db, auth, items = [], isAdmin = false, editId = null, photoData = "";
let cart = JSON.parse(localStorage.getItem("cart") || "{}");

if (configured) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app); auth = getAuth(app);
  onSnapshot(query(collection(db, "items"), orderBy("createdAt", "desc")), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
  });
  onAuthStateChanged(auth, u => {
    isAdmin = !!u;
    $("addBtn").classList.toggle("hidden", !isAdmin);
    $("logoutBtn").classList.toggle("hidden", !isAdmin);
    $("adminBtn").classList.toggle("hidden", isAdmin);
    render();
  });
} else {
  $("empty").textContent = "Add your Firebase config in index.html to connect the shop.";
  $("empty").classList.remove("hidden");
}

const money = n => CURRENCY + Number(n).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function render() {
  $("grid").innerHTML = items.map(i => `
    <article class="item">
      <img src="${i.photo || ""}" alt="${esc(i.name)}" loading="lazy">
      <div class="body">
        <h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p>
        <div class="row"><span class="price">${money(i.price)}</span>
        <button class="primary" data-add="${i.id}">Add to cart</button></div>
        ${isAdmin ? `<div class="row"><button data-edit="${i.id}">Edit</button><button class="danger" data-del="${i.id}">Delete</button></div>` : ""}
      </div>
    </article>`).join("");
  if (configured) $("empty").classList.toggle("hidden", items.length > 0);
  updateCart();
}

$("grid").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.add) { cart[t.dataset.add] = (cart[t.dataset.add] || 0) + 1; saveCart(); }
  if (t.dataset.edit) openItem(items.find(i => i.id === t.dataset.edit));
  if (t.dataset.del && confirm("Delete this item?")) await deleteDoc(doc(db, "items", t.dataset.del));
});

/* ---- Cart ---- */
function saveCart() { localStorage.setItem("cart", JSON.stringify(cart)); updateCart(); }
function updateCart() {
  const lines = Object.entries(cart).filter(([id]) => items.some(i => i.id === id));
  $("cartCount").textContent = lines.reduce((n, [, q]) => n + q, 0);
  let total = 0;
  $("cartLines").innerHTML = lines.length ? lines.map(([id, q]) => {
    const i = items.find(x => x.id === id); total += i.price * q;
    return `<div class="cartline"><span>${esc(i.name)} × ${q}</span><span>${money(i.price * q)} <button data-rm="${id}">Remove</button></span></div>`;
  }).join("") : `<p class="empty" style="padding:10px 0">Your cart is empty.</p>`;
  $("cartTotal").textContent = money(total);
}
$("cartBtn").onclick = () => { $("cartMsg").textContent = ""; $("cartDlg").showModal(); };
$("cartClose").onclick = () => $("cartDlg").close();
$("cartLines").addEventListener("click", e => { if (e.target.dataset.rm) { delete cart[e.target.dataset.rm]; saveCart(); } });
$("cartOrder").onclick = async () => {
  const lines = Object.entries(cart).filter(([id]) => items.some(i => i.id === id));
  if (!lines.length) return $("cartMsg").textContent = "Add an item to your cart first.";
  if (!$("cName").value.trim() || !$("cContact").value.trim()) return $("cartMsg").textContent = "Enter your name and a phone or email.";
  try {
    const order = lines.map(([id, q]) => { const i = items.find(x => x.id === id); return { name: i.name, price: i.price, qty: q }; });
    await addDoc(collection(db, "orders"), { customer: $("cName").value.trim(), contact: $("cContact").value.trim(), items: order, total: order.reduce((s, o) => s + o.price * o.qty, 0), createdAt: serverTimestamp() });
    cart = {}; saveCart(); $("cartDlg").close(); alert("Order placed. We will contact you soon.");
  } catch (err) { $("cartMsg").textContent = "Could not place the order: " + err.message; }
};

/* ---- Admin login ---- */
$("adminBtn").onclick = () => { if (!configured) return alert("Add your Firebase config first."); $("loginMsg").textContent = ""; $("loginDlg").showModal(); };
$("loginCancel").onclick = () => $("loginDlg").close();
$("loginGo").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value, $("pass").value); $("loginDlg").close(); $("pass").value = ""; }
  catch { $("loginMsg").textContent = "Wrong email or password."; }
};
$("logoutBtn").onclick = () => signOut(auth);

/* ---- Add / edit item ---- */
function openItem(it) {
  editId = it?.id || null; photoData = it?.photo || "";
  $("itemTitle").textContent = it ? "Edit item" : "Add item";
  $("iName").value = it?.name || ""; $("iPrice").value = it?.price ?? ""; $("iDesc").value = it?.desc || ""; $("iPhoto").value = "";
  $("iPreview").src = photoData; $("iPreview").classList.toggle("hidden", !photoData);
  $("itemMsg").textContent = ""; $("itemDlg").showModal();
}
$("addBtn").onclick = () => openItem();
$("itemCancel").onclick = () => $("itemDlg").close();

// Resize the photo in the browser so it fits in Firestore (free plan, no Storage needed)
$("iPhoto").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 800, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    photoData = c.toDataURL("image/jpeg", 0.75);
    $("iPreview").src = photoData; $("iPreview").classList.remove("hidden");
  };
  img.src = URL.createObjectURL(f);
};
$("itemSave").onclick = async () => {
  const name = $("iName").value.trim(), price = parseFloat($("iPrice").value);
  if (!name || isNaN(price)) return $("itemMsg").textContent = "Enter a name and a price.";
  if (!photoData) return $("itemMsg").textContent = "Choose a photo.";
  const data = { name, price, desc: $("iDesc").value.trim(), photo: photoData };
  try {
    if (editId) await setDoc(doc(db, "items", editId), data, { merge: true });
    else await addDoc(collection(db, "items"), { ...data, createdAt: serverTimestamp() });
    $("itemDlg").close();
  } catch (err) { $("itemMsg").textContent = "Could not save: " + err.message; }
};
render();
</script>
</body>
</html>
